
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

    <title>Skills Test</title>
</head>

<body>
    <div class="container py-5">
        <h1>Non-Metal Elements Search</h1>
        <div class="card p-4 shadow">
            <label for="symbol" class="form-label">
                Enter Element Symbol:
            </label>
            <input type="text" id="symbol" class="form-control mb-3" placeholder="Enter element symbol">
            <button id="search-button" py-click="search_element">
                Search Element
            </button>
            <div id="result">
                Enter an element symbol and click Search Element.
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
